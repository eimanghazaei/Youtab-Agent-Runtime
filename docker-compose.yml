#
# docker-compose.yml for Youtab Agent Runtime
#
# Usage:
#   YOUTAB_AGENT_UID=$(id -u) YOUTAB_AGENT_GID=$(id -g) docker compose up -d
#
# Set YOUTAB_AGENT_UID / YOUTAB_AGENT_GID to the host user that owns ~/.youtab-agent-runtime so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `youtab` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/youtab/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  # ONE container. The dashboard is an s6-supervised service *inside* the
  # gateway-role container, not a container of its own.
  #
  # This was two services until it was found not to work. `service_manager`
  # locates supervised slots under `/run/service`, which is container-local
  # tmpfs: a `gateway-default` slot registered inside a gateway container is
  # invisible to a dashboard in a separate container, so the dashboard's
  # Restart Gateway control failed with `no such gateway 'default'` and the UI
  # reported "Gateway restart failed with exit 1 / Gateway Status: Off".
  #
  # There is no IPC that would have fixed the split: no lifecycle API, no
  # control socket, no shared supervisor. Mounting the Docker socket would
  # have "worked" and is not an option -- it hands the web application root
  # control of the host.
  #
  # The role is decided by the command. `gateway run` makes
  # `container_boot._is_gateway_container` true, so the boot reconciler
  # registers `gateway-default`. A `dashboard` command selects the
  # dashboard-only role, which deliberately skips gateway registration to
  # avoid lock contention on `logs/gateways/<profile>/lock` -- correct
  # behaviour, and the reason a second dashboard container must not come back.
  youtab-agent-runtime:
    build: .
    image: youtab-agent-runtime
    container_name: youtab-agent-runtime
    restart: unless-stopped
    # Host networking: the dashboard binds loopback and the reverse proxy
    # reaches it there. Nothing is published.
    network_mode: host
    volumes:
      - youtab-agent-data:/opt/data
    environment:
      - YOUTAB_AGENT_UID=${YOUTAB_AGENT_UID:-10000}
      - YOUTAB_AGENT_GID=${YOUTAB_AGENT_GID:-10000}
      # Supervised dashboard. Both HOST and PORT are set explicitly: the run
      # script defaults to 0.0.0.0:9119, and a non-loopback bind engages the
      # auth gate, which fails closed with no provider registered.
      - YOUTAB_AGENT_DASHBOARD=1
      - YOUTAB_AGENT_DASHBOARD_HOST=${YOUTAB_AGENT_DASHBOARD_HOST:-127.0.0.1}
      - YOUTAB_AGENT_DASHBOARD_PORT=${YOUTAB_AGENT_DASHBOARD_PORT:-8081}
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${YOUTAB_AGENT_DASHBOARD_PORT:-8081}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  youtab-agent-data:
