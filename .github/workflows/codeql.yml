# CodeQL security-and-quality analysis, uploaded to GitHub Code Scanning.
#
# This workflow used to carry a 1.4 MB committed baseline and a custom SARIF
# gate, because Code Scanning uploads were unavailable on a private repository
# without Advanced Security. The repository is public now, so uploads are free
# and that entire workaround is gone -- findings land in the native Code
# Scanning UI, which has per-alert dismissal with a reason, severity filtering
# and history that a JSON file in the tree could never provide.
#
# Advanced setup rather than GitHub's default setup, deliberately: default
# setup only offers the `default` and `extended` query suites (the API rejects
# anything else), and neither runs the QUALITY queries. Those are 7598 of this
# repository's 9076 findings -- py/empty-except, py/cyclic-import,
# py/unused-import and the rest. Keeping `security-and-quality` is the whole
# reason this file still exists.
name: CodeQL no-new-findings gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # Required to upload SARIF to Code Scanning. This is the permission that
  # was pointless while uploads were unavailable.
  security-events: write

# Diff-informed analysis OFF. This is the single setting that made this gate
# incoherent, and it is load-bearing -- deleting it silently shrinks every
# pull-request analysis back to the diff.
#
# The CodeQL action enables diff-informed queries by default on
# `pull_request` (`defaultValue: true` for `Feature.DiffInformedQueries` in
# the action's src/feature-flags.ts at the SHA pinned below, gated on CLI
# >= 2.21.0; this runner is on 2.26.4). It builds a "diff range extension
# pack" and restricts DATAFLOW query results to lines the pull request
# touched. Syntactic queries are unaffected.
#
# So the same tree produced two different answers depending on the event,
# and the gate was comparing across them:
#
#   pull_request run   7701 findings  (taint-tracking clipped to the diff)
#   push-to-main run   8971 findings  (full taint-tracking)
#
# The committed baseline had been captured from a `pull_request` run, so it
# recorded 0 findings for all 13 interprocedural dataflow queries -- while
# every push to main measured 1272 of them and reported them as new. That is
# why this gate was red on main continuously, and why it was dropped from
# the required checks.
#
# The second, worse half: a pull request can introduce a dataflow
# vulnerability whose source and sink lines it does not itself touch. Under
# diff-informed analysis the pull-request scan drops that result and reports
# green; the finding then appears on main after the merge, where nothing is
# gating. A gate that cannot see a class of regression on the pull request is
# not gating that class.
#
# Turning it off costs wall-clock on pull requests (this job already runs
# 23-28 min) and buys a single, comparable measurement for every event, which
# is the only basis on which a no-new-findings baseline means anything.
# `tests/youtab_runtime/test_codeql_gate_wiring.py` fails if this is removed.
env:
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"

jobs:
  analyze:
    # The name is pinned to the language ALONE and must stay that way. With a
    # bare `name: CodeQL analyze`, GitHub derives the check context from the
    # whole matrix entry, so adding `build-mode` renamed every context to
    # `CodeQL analyze (python, none)` and silently orphaned the
    # `CodeQL analyze (python)` entries in the `main-required-gates` ruleset --
    # which blocks every pull request forever, waiting on a status nothing
    # produces. Renaming this is a two-place change, here and in the ruleset.
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every language in the tree, because default setup and an advanced
        # workflow cannot coexist: GitHub rejects every advanced upload while
        # default setup is enabled ("CodeQL analyses from advanced
        # configurations cannot be processed when the default setup is
        # enabled"), for ALL languages, not just the overlapping ones. So this
        # workflow has to cover everything or those languages get nothing.
        #
        #   python                 58.9 MB
        #   javascript-typescript  16.5 MB  (js + ts + the `javascript`/
        #                                   `typescript` aliases collapse here)
        #   rust                    243 KB  apps/bootstrap-installer/src-tauri
        #                                   -- a Tauri installer that runs
        #                                   PowerShell and performs updates
        #   c-cpp                   9.6 KB  native/fts5_cjk/fts5_cjk.c
        #                                   -- a SQLite FTS5 CJK tokenizer
        #   actions                         the workflow definitions
        #
        # build-mode: none everywhere -- nothing here needs a compile for
        # CodeQL to extract it, and `none` is what default setup used for
        # c-cpp and rust when it analysed them successfully.
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record changed source paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only -z "$BASE_SHA" HEAD > changed-files.bin
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Pull request base commit unavailable; cannot verify changed-file extraction" >&2
            exit 1
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only -z HEAD^ HEAD > changed-files.bin
          else
            : > changed-files.bin
          fi
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Uploads by default. Code Scanning itself now does the job the
          # committed baseline was imitating: it tracks which alerts are
          # already known, which are new on this pull request, and which were
          # dismissed and why -- and it reports NEW alerts on the pull request
          # without a baseline file to keep in sync.
          upload: always
