# CodeQL security-and-quality analysis, uploaded to GitHub Code Scanning.
#
# TWO mechanisms, deliberately, because neither covers what the other does.
#
# The committed baseline and the custom SARIF comparator were written when
# Code Scanning uploads were unavailable on a private repository without
# Advanced Security. The repository is public now, so uploads are free -- but
# they are NOT a replacement for the comparator, and the plan to drop it in
# their favour was reversed. The upload gives the native alert UI, per-alert
# dismissal with a reason, severity filtering and history that a JSON file in
# the tree never could. What it does not give is enforcement: a 5000-result
# cap that discards ~4076 of this repository's python findings quality-first,
# a results check that fails only on error/critical/high, PR gating only for
# alerts whose every line is in the diff, and extraction errors that surface
# for manual reading rather than failing the run. The four limits are set out
# against the analyze step below.
#
# So: `upload: always` AND `output: results`, the comparator reading the full
# local SARIF, and the artifact kept for baseline regeneration.
#
# Advanced setup rather than GitHub's default setup, deliberately: default
# setup only offers the `default` and `extended` query suites (the API rejects
# anything else), and neither runs the QUALITY queries. Those are 7598 of this
# repository's 9076 findings -- py/empty-except, py/cyclic-import,
# py/unused-import and the rest. Keeping `security-and-quality` is the whole
# reason this file still exists.
name: CodeQL no-new-findings gate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # Required to upload SARIF to Code Scanning. This is the permission that
  # was pointless while uploads were unavailable.
  security-events: write

# Diff-informed analysis OFF. This is the single setting that made this gate
# incoherent, and it is load-bearing -- deleting it silently shrinks every
# pull-request analysis back to the diff.
#
# The CodeQL action enables diff-informed queries by default on
# `pull_request` (`defaultValue: true` for `Feature.DiffInformedQueries` in
# the action's src/feature-flags.ts at the SHA pinned below, gated on CLI
# >= 2.21.0; this runner is on 2.26.4). It builds a "diff range extension
# pack" and restricts DATAFLOW query results to lines the pull request
# touched. Syntactic queries are unaffected.
#
# So the same tree produced two different answers depending on the event,
# and the gate was comparing across them:
#
#   pull_request run   7701 findings  (taint-tracking clipped to the diff)
#   push-to-main run   8971 findings  (full taint-tracking)
#
# The committed baseline had been captured from a `pull_request` run, so it
# recorded 0 findings for all 13 interprocedural dataflow queries -- while
# every push to main measured 1272 of them and reported them as new. That is
# why this gate was red on main continuously, and why it was dropped from
# the required checks.
#
# The second, worse half: a pull request can introduce a dataflow
# vulnerability whose source and sink lines it does not itself touch. Under
# diff-informed analysis the pull-request scan drops that result and reports
# green; the finding then appears on main after the merge, where nothing is
# gating. A gate that cannot see a class of regression on the pull request is
# not gating that class.
#
# Turning it off costs wall-clock on pull requests (this job already runs
# 23-28 min) and buys a single, comparable measurement for every event, which
# is the only basis on which a no-new-findings baseline means anything.
# `tests/youtab_runtime/test_codeql_gate_wiring.py` fails if this is removed.
env:
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"

jobs:
  analyze:
    # The name is pinned to the language ALONE and must stay that way. With a
    # bare `name: CodeQL analyze`, GitHub derives the check context from the
    # whole matrix entry, so adding `build-mode` renamed every context to
    # `CodeQL analyze (python, none)` and silently orphaned the
    # `CodeQL analyze (python)` entries in the `main-required-gates` ruleset --
    # which blocks every pull request forever, waiting on a status nothing
    # produces. Renaming this is a two-place change, here and in the ruleset.
    name: CodeQL analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every language in the tree, because default setup and an advanced
        # workflow cannot coexist: GitHub rejects every advanced upload while
        # default setup is enabled ("CodeQL analyses from advanced
        # configurations cannot be processed when the default setup is
        # enabled"), for ALL languages, not just the overlapping ones. So this
        # workflow has to cover everything or those languages get nothing.
        #
        #   python                 58.9 MB
        #   javascript-typescript  16.5 MB  (js + ts + the `javascript`/
        #                                   `typescript` aliases collapse here)
        #   rust                    243 KB  apps/bootstrap-installer/src-tauri
        #                                   -- a Tauri installer that runs
        #                                   PowerShell and performs updates
        #   c-cpp                   9.6 KB  native/fts5_cjk/fts5_cjk.c
        #                                   -- a SQLite FTS5 CJK tokenizer
        #   actions                         the workflow definitions
        #
        # build-mode: none everywhere -- nothing here needs a compile for
        # CodeQL to extract it, and `none` is what default setup used for
        # c-cpp and rust when it analysed them successfully.
        include:
          # `gate: true` means the fail-closed comparator below also runs.
          # It needs a committed baseline, and a baseline is only worth
          # carrying where Code Scanning's limits actually bite -- which is a
          # function of volume:
          #
          #   python                 9076 findings -> capped at 5000. 4076
          #                          dropped, quality-first because the cap
          #                          sorts by severity. Gated.
          #   javascript-typescript   110 findings -> under the cap today, but
          #                          57 are security and the rest are quality
          #                          that the results check would not fail on.
          #                          Gated.
          #   actions                   1 finding
          #   c-cpp                     2 findings
          #   rust                      0 findings
          #
          # The last three are below every limit that makes the comparator
          # worth its baseline: nothing is dropped by a 5000 cap when there
          # are 3 findings in total, and Code Scanning reports and tracks them
          # natively. They are analysed and uploaded on every run, and their
          # checks are required -- they are simply not baseline-compared.
          # `tests/youtab_runtime/test_codeql_gate_wiring.py` pins this split
          # so a language cannot quietly lose BOTH forms of coverage.
          - language: python
            build-mode: none
            gate: true
          - language: javascript-typescript
            build-mode: none
            gate: true
          - language: actions
            build-mode: none
            gate: false
          - language: c-cpp
            build-mode: none
            gate: false
          - language: rust
            build-mode: none
            gate: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Record changed source paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only -z "$BASE_SHA" HEAD > changed-files.bin
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "Pull request base commit unavailable; cannot verify changed-file extraction" >&2
            exit 1
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only -z HEAD^ HEAD > changed-files.bin
          else
            : > changed-files.bin
          fi
      # BOTH CodeQL steps are pinned to the SAME release, and they have to move
      # together. Dependabot opened #74 bumping only `init` to v4.38.2 while
      # `analyze` stayed on v3.37.9; since 3.30.4 the action validates this and
      # the non-init steps THROW when they load a configuration file generated
      # by a different version of `init`, so that bump would have failed every
      # run at `analyze` with no SARIF produced -- a red gate with a cause three
      # steps away from the symptom.
      #
      # v4 rather than the parallel v3.38.2: the v3 and v4 lines are the same
      # code (both 38.2 releases ship CodeQL bundle 2.27.1 from the same PR);
      # v4 is the Node.js 24 runtime and v3 is kept on Node 20 for older
      # self-hosted runners and GHES. These jobs run on github.com-hosted
      # `ubuntu-latest`, so v4 is the current line here.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          # BOTH: upload for visibility, and keep the local SARIF for the
          # gate below. These are not alternatives -- the gate reads
          # `output:` off the runner, the upload is a separate side effect,
          # and each covers what the other cannot.
          #
          # Code Scanning gives the alert UI, per-alert dismissal with a
          # reason, severity filtering and history. What it does NOT give is
          # enforcement, for four documented reasons:
          #
          #   1. A SARIF run is capped at 5000 results, prioritised by
          #      severity. This repository's python analysis reports 9076, and
          #      every upload lands at exactly results=5000 -- so ~4076
          #      findings are dropped, and because the cap sorts by severity
          #      the ones dropped are the QUALITY findings, which carry no
          #      security severity. Those are the 7598 that justify running
          #      `security-and-quality` at all.
          #   2. The "Code scanning results" check fails by default only for
          #      error/critical/high. A new `warning` or `recommendation` --
          #      most of the quality suite -- publishes and passes.
          #   3. An alert only gates a pull request when ALL of its reported
          #      lines are in the diff. The interprocedural case this
          #      workflow disables diff-informed queries to catch is exactly
          #      the case whose source and sink are NOT in the diff.
          #   4. Nonfatal extraction errors and skipped source files do not
          #      fail the upload; they surface on the tool-status page for
          #      manual reading.
          #
          # The gate below has none of those limits: it reads the full local
          # SARIF, compares every finding against the committed baseline
          # regardless of severity or diff, and fails closed on artifact or
          # extraction coverage loss.
          upload: always
          output: results
      - name: Preserve SARIF for finding triage
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: results/*.sarif
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on new CodeQL findings or missing SARIF
        if: ${{ matrix.gate }}
        run: python scripts/youtab/codeql_sarif_gate.py results scripts/youtab/codeql_baselines/${{ matrix.language }}.json changed-files.bin
