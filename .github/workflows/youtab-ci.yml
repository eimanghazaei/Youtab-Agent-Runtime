name: Youtab Agent Runtime gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: python -m pip install -e '.[dev]'
      - name: Unit, integration, E2E, OWASP, SAST, secret, dependency and branding gates
        run: scripts/youtab/run_all_gates.sh

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install exact JavaScript lock
        run: npm ci
      - name: Type, lint and workspace tests
        run: npm run check
