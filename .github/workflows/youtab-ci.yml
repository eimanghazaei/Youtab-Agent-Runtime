name: Youtab Agent Runtime gates

on:
  pull_request:
  # `push` to main, because `pull_request` never verifies main itself.
  #
  # A `pull_request` run builds a throwaway merge of the PR head onto whatever
  # main was AT THAT MOMENT, and reports on that ephemeral commit. So two PRs
  # can each go green against main@X and then be merged minutes apart: the
  # second merge produces main@Z, a tree no run has ever seen, and nothing in
  # this workflow notices. That is a mid-air collision, and it is the one way a
  # repository with four green required checks still ends up with a broken main.
  # It is not hypothetical here -- this branch's own history contains a
  # "pin the new job to the checkout main already moved to" commit, which is
  # what that collision looks like when a human catches it by hand.
  #
  # It is also the sequencing that makes the four contexts reportable on the
  # branch at all. Before this, main's tip carried exactly one check run
  # (Dependabot) and none of the gates, so branch protection was being asked to
  # require statuses that had never once been produced for a commit on main.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    # Finite bound so a wedged step cannot burn the 6h default (WAVE-24). Set
    # well above the job's normal duration — it caps runaways, not normal runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: "3.12"
      # `.[dev]` pins Starlette but NOT FastAPI: the core dependency is
      # `fastapi>=0.104.0,<1`, so pip resolved whatever was newest and this job
      # tested a different router framework than production builds. That is not
      # academic -- it reported 136 of this application's 294 routes because a
      # newer FastAPI wraps included routers in a type the older one flattens.
      # The `web` extra carries the same FastAPI pin the production image gets
      # from `uv.lock`, so adding it makes the tested framework the deployed one.
      - name: Install locked development environment
        # `slack` joins dev,web because the gate now runs the whole
        # `tests/youtab_agent_cli` directory, and the platform-picker tests
        # assert on plugins that only import when their extra is present.
        # Without it `slack-platform` fails to load on `No module named
        # 'aiohttp'`, slack drops out of the picker, and the test correctly
        # reports over-filtering. The right fix is to give the tests the
        # environment they describe, not to teach the test to expect a
        # half-installed one. No pyproject change, so `uv lock --check` is
        # unaffected: these pins already live in the `slack` extra.
        #
        # `wakeword-ingest` joins for the same reason and is spelled as the extra
        # on purpose. This gate collects the whole of `tests/tools`, which
        # includes the wake-word ingestion suites, and human speaker submissions
        # arrive as AAC-LC `.m4a` at 48 kHz from phone voice-memo apps:
        # `scripts/wakeword/import_speaker.py` reads container facts itself but
        # needs a real decoder (PyAV) for the LEVEL facts -- peak, RMS, clipping
        # runs, noise floor. Those tests fail rather than skip where the decoder
        # is missing, deliberately, because a skip is exactly how PyAV stayed an
        # undocumented host dependency until it was pinned. Named as the extra
        # rather than as a bare `av==` pin so this job exercises one of the two
        # install commands `pyproject.toml` documents for an ingestion machine,
        # and so the pin cannot drift between here and the lock.
        #
        # Extended in place rather than added as a second step: the editable
        # install is governed by
        # `tests/youtab_runtime/test_framework_version_matches_lock.py`
        # (`test_required_ci_installs_the_governed_extra`), which requires every
        # `pip install -e` line here to carry the `web` extra so FastAPI cannot
        # resolve freely from the core range again.
        run: python -m pip install -e '.[dev,web,slack,wakeword-ingest]'
      # The branding gate OCRs every shipped image, and this runner had no OCR
      # engine at all -- so it read none of the 61 tracked images and reported
      # that as if the images were at fault.
      #
      # RapidOCR rather than tesseract, measured on this repository's assets:
      # over the same 61 images, rapidocr finds the 16 that carry the retired
      # brand and tesseract finds 1. These are UI screenshots with small
      # anti-aliased text, which tesseract reads poorly. Installing tesseract
      # here would be worse than useless: `_ocr_backend()` prefers whichever
      # engine it finds first, so its presence would displace the accurate one
      # and turn a known 16-image finding into a falsely reassuring 1.
      - name: Install the OCR engine the branding gate needs
        run: python -m pip install 'rapidocr-onnxruntime==1.4.4'
      # `uv lock --check --offline` exited 127 -- uv was never on this runner,
      # so the lock file has never actually been verified in CI. Installed from
      # PyPI rather than via a setup action: every action here is SHA-pinned,
      # and a pip pin is a smaller supply-chain surface than a new action.
      # 0.8.17 is the version this lock (version 1, revision 3) was verified
      # against.
      - name: Install uv for the lock-file gate
        run: python -m pip install 'uv==0.8.17'
      # The wake word ships two artifacts, and macOS ARM64 loads the tflite one
      # because openWakeWord's ONNX embedding model is dead there
      # (dscripka/openWakeWord#336). `onnxruntime` reaches this runner as a
      # transitive of the OCR engine above, so the ONNX artifact is executed by
      # the regression tests either way -- without a tflite interpreter the
      # file every Mac user actually loads would ship unexecuted, which is the
      # gap this repository just spent a commit closing for `tests/tools`.
      #
      # Same pin as the `wake` extra, and a workflow step rather than a `dev`
      # entry for the reason recorded below: it is CI tooling, and adding it to
      # the extra would regenerate uv.lock.
      - name: Install the tflite runtime the wake-word regression tests need
        run: python -m pip install 'ai-edge-litert==2.1.6'
      # Discord Voice decrypts RTP with PyNaCl's AEAD. WAVE-29 bumped PyNaCl to
      # 1.6.2 (CVE-2025-69277 fix) via a uv override, but this job installs with
      # `pip install -e`, which does NOT honor [tool.uv] override-dependencies —
      # so PyNaCl is installed explicitly here at the locked version, matching
      # uv.lock. tests/gateway/test_discord_voice_crypto.py exercises the real
      # VoiceReceiver crypto path and asserts the running PyNaCl is >=1.6.2, so a
      # regression to a vulnerable pin fails the required gate rather than
      # silently validating a vulnerable build. `discord.py` itself is not needed
      # (VoiceReceiver imports without it; the native Opus decoder is stubbed).
      # Kept out of the `dev` extra for the same reason as the pins above: it is
      # CI tooling and would otherwise force a uv.lock regeneration.
      - name: Install the PyNaCl the Discord Voice crypto tests need
        run: python -m pip install 'pynacl==1.6.2'
      # `scripts/run_tests.sh` refuses to run unless it finds a venv carrying
      # pytest at .venv/ or venv/, or YOUTAB_AGENT_PYTHON pointing at a python
      # that has it. `pip install -e '.[dev]'` above installs into the
      # setup-python interpreter, which is neither -- so the guard fired and
      # the runtime suite has never once executed here. Pointing the variable
      # at that interpreter satisfies the guard without weakening it.
      #
      # Both pins above are deliberately kept out of the `dev` extra: they are
      # CI tooling, not package dependencies, and adding them there would force
      # a uv.lock regeneration that the uv-lock gate then has to re-verify.
      - name: Unit, integration, E2E, OWASP, SAST, secret, dependency and branding gates
        env:
          YOUTAB_AGENT_PYTHON: ${{ steps.py.outputs.python-path }}
        run: scripts/youtab/run_all_gates.sh
      # In this job rather than a job of its own, because `python-security` is
      # a required check and a new job would not be: a TLS floor proved by a
      # check nobody has to pass is a floor that can be removed by a green PR.
      #
      # Not in `run_all_gates.sh` either. That script runs on workstations,
      # where a missing binary is reported as a gate failure -- correctly, but
      # it would mean every local run of every gate went red for want of a
      # Docker daemon that this repository does not otherwise need.
      #
      # `!cancelled()` so the TLS evidence is produced even when an unrelated
      # gate above fails. The job is still red either way; this only decides
      # whether the run tells you about both.
      - name: Origin TLS floor -- nginx 1.18 config test and real handshake matrix
        if: ${{ !cancelled() }}
        run: scripts/youtab/nginx_tls_gate.sh
      # A06: dependency CVE scanning (integrity != vulnerability — the
      # dependency_gate proves the lock matches, this proves the locked versions
      # have no KNOWN CVEs). BLOCKING as of WAVE-28: every disclosed advisory was
      # closed at the source (pins bumped + uv.lock regenerated), so
      # cve_allowlist.toml is empty. A new applicable Critical/High/Medium
      # advisory — or a scanner failure / malformed output (cve_audit.py exits 2,
      # fail-closed) — now fails the required `python-security` job. It runs as a
      # step of this already-required job rather than a new context on purpose: a
      # floor proved by a check nobody must pass is a floor a green PR can remove.
      #
      # SCOPE: audit the LOCKED PROJECT dependency graph exported from uv.lock —
      # NOT this runner's interpreter. The runner also carries CI-only tooling
      # (uv, pip-audit, rapidocr-onnxruntime) installed with bare `pip install`,
      # never shipped and deliberately absent from uv.lock; auditing the
      # interpreter conflated those tools with project dependencies (e.g. uv's
      # own CVEs). `uv export --all-extras` resolves, from the lock, EVERY extra
      # this project ships — the core install plus every opt-in adapter/backend
      # (telegram, discord[voice], google, fal, matrix, teams, dingtalk, ...) —
      # so the gate audits the entire shipped surface, deterministically, with no
      # tool noise. `--no-deps --disable-pip` audits precisely those exported
      # pins against the advisory DB WITHOUT invoking pip at all: the lock is
      # already the full pinned closure, so no resolution is needed, and skipping
      # pip avoids its venv step failing on a locked pin whose Requires-Python
      # excludes this runner's interpreter (a resolver artifact, never a real
      # vulnerability) as well as any sdist build.
      #
      # WAVE-29 flipped this from the installed-subset to the FULL `--all-extras`
      # surface. Every advisory previously found only under an opt-in extra is now
      # closed at the source and enforced by this blocking gate:
      #   * tornado>=6.5.8, pyasn1>=0.6.4, httplib2>=0.32.0, msgpack>=1.2.1
      #     ([tool.uv] constraint floors), and
      #   * pynacl: discord.py[voice] pulls PyNaCl, and discord.py 2.7.1 (latest)
      #     hard-caps PyNaCl<1.6, so CVE-2025-69277 / PYSEC-2026-3002 (a
      #     libsodium input-validation issue fixed in 1.6.2) had no satisfiable
      #     in-cap bump. WAVE-29 closed it with a narrow, reproducible
      #     [tool.uv] override-dependencies = ["pynacl>=1.6.2"]: the <1.6 cap is
      #     defensive, not a real API break — nacl.secret.Aead and the AEAD
      #     bindings our VoiceReceiver uses are identical in 1.5.0 and 1.6.2, and
      #     Discord voice is exercised by the crypto/RTP regression suite. The
      #     override is visible in uv.lock (hash-pinned) and to this gate.
      # cve_allowlist.toml remains EMPTY: nothing is suppressed — every finding is
      # fixed at the source. A new applicable Critical/High/Medium advisory (or a
      # scanner error) fails this required job, fail-closed.
      #
      # ai-edge-litert is a genuine LOCKED dependency (Darwin-only, macOS tflite
      # interpreter) — uv export filters it out on this Linux runner by its
      # platform marker, not by any allowlist; it is audited on macOS via its own
      # locked pin. Not in run_all_gates.sh for the reason on the TLS step: it
      # needs pip-audit + network, which a workstation run should not require.
      - name: Install pip-audit for the CVE gate
        if: ${{ !cancelled() }}
        run: python -m pip install 'pip-audit==2.10.1'
      - name: CVE audit (pip-audit over the FULL locked project graph, all extras) [blocking]
        if: ${{ !cancelled() }}
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --frozen \
            --all-extras \
            -o "$RUNNER_TEMP/audit-reqs.txt"
          python scripts/youtab/cve_audit.py --requirement "$RUNNER_TEMP/audit-reqs.txt" --no-deps --disable-pip --output "$RUNNER_TEMP/cve-audit.json"
      - name: CycloneDX SBOM (artifact, never fails)
        if: ${{ !cancelled() }}
        run: python scripts/youtab/generate_sbom.py --output "$RUNNER_TEMP/sbom.cdx.json"

  # Both shipped wake-word artifacts, executed on the operating systems that
  # load them. `python-security` above already runs the regression suite, but
  # only on ubuntu-latest, so two of the three desktop platforms have never
  # executed the file their users actually load: Windows loads
  # `hey_youtab.onnx`, and macOS ARM64 loads `hey_youtab.tflite` because
  # openWakeWord's ONNX embedding model returns near-zero scores there
  # (dscripka/openWakeWord#336).
  #
  # A separate job because the whole subject is the runner OS — `python-security`
  # cannot absorb it the way the TLS step was absorbed. That did mean it was not
  # a required check, and the note on the TLS step above says why that matters.
  # Both legs are now required on main by the `main-required-gates` ruleset:
  # `wake-word-backends (ubuntu-latest)` and
  # `wake-word-backends (windows-latest)`, alongside `python-security` and
  # `javascript`. Renaming this job or either matrix entry renames the check
  # context and the ruleset then waits forever on a status nothing produces --
  # so a rename is a two-place change, here and in the ruleset.
  wake-word-backends:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # macOS ARM64 is ENABLED. It is the one platform where the tflite
        # artifact is what users actually load — `default_inference_framework()`
        # returns tflite on Darwin ARM64 and onnx everywhere else — so without
        # this leg the shipped .tflite is never exercised on the OS that loads
        # it, and `verify_backends.py` runs unchanged here.
        #
        # Cost, stated rather than hidden: this repository is private, where
        # GitHub bills macOS minutes at 10x. The job is small — the other two
        # legs finish in 24-50s — so the exposure is minutes, not hours, and
        # the alternative was shipping a tflite artifact no CI job ever loaded
        # on its target OS.
        #
        # `include:` rather than a third entry in `os:` above so the literal
        # `os:` list stays the thing the CI-wiring test reads.
        include:
          - os: macos-latest
        #
        # Do NOT add `macos-13`, and do NOT "fix" a failure here by switching to
        # it. That runner is Intel, and neither pin has a macOS x86_64 wheel:
        # onnxruntime==1.27.0 publishes only macosx_14_0_arm64 for Darwin
        # (its universal2 build was dropped after 1.22.0) and ai-edge-litert
        # has only ever shipped arm64 there. The job would fail at
        # `pip install`, and it would be right to. Apple-Silicon runners
        # (`macos-latest`, or a pinned `macos-14`/`macos-15`) are the only
        # viable macOS legs.
    runs-on: ${{ matrix.os }}
    # Finite bound so a wedged step cannot burn the 6h default (10x billing on
    # the macOS leg). Set above normal duration — caps runaways, not normal runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The `wake` extra's own pins, not `latest`. The claim being made is
      # about the artifacts under the versions users install, so a newer
      # runtime here would measure something nobody runs. `ai-edge-litert` is
      # marked `platform_system == 'Darwin'` in that extra and is installed
      # unconditionally here, because the tflite artifact ships on every
      # platform and an untested binary is the gap this job closes.
      - name: Install both wake-word backends at the shipped pins
        run: python -m pip install "numpy==2.4.3" "onnxruntime==1.27.0" "ai-edge-litert==2.1.6" "pytest==9.0.3"
      - name: Both artifacts load, agree and keep up with the frame rate
        run: python scripts/wakeword/verify_backends.py --report backend-report.json
      # The report is the evidence, and it is printed rather than uploaded:
      # every action in this workflow is SHA-pinned, and a log line is a
      # smaller supply-chain surface than a new action. It contains only
      # scores over committed synthetic fixtures — no recorded speech, no
      # paths outside the checkout.
      - name: The measured record
        run: cat backend-report.json
      - name: Parity, latency and memory gate
        run: python -m pytest tests/tools/test_wake_word_backend_parity.py tests/tools/test_wake_word_model_assets.py -q
      # The real-human ingestion guards, on both operating systems.
      #
      # `python-security` above already collects the whole of `tests/tools`, so
      # these executed -- but only ever on ubuntu-latest. That is not good
      # enough for this particular file, because every guard in it is about
      # paths, filesystem reads and manifest bytes: `build_dataset` resolves
      # each clip against the manifest's own directory, hashes the manifest
      # bytes into stats, and refuses a manifest whose declared split is not
      # `train`. Path resolution and byte-exact hashing are precisely where
      # Windows differs (separators, and the text mode that would turn LF into
      # CRLF and change the sha256 of the thing being traced). A guard that
      # protects the sealed evaluation speaker on Linux and has never been
      # executed on Windows is a guard whose coverage stops at the operator's
      # choice of laptop.
      #
      # In this job rather than a new one, for the reason recorded on the TLS
      # step in `python-security`: this job's two legs are required checks and a
      # new job would not be, so a fail-closed guard proved only by a check
      # nobody has to pass could be removed by a green PR.
      #
      # No new dependency. The file needs numpy and pytest, both already
      # installed above; `pyroomacoustics` and openWakeWord are monkeypatched
      # out by the tests themselves, and no recorded speech is read -- the
      # fixtures describe a speaker who does not exist.
      - name: Real-human ingestion guards (train-split-only, sealed speaker, excluded clips)
        run: python -m pytest tests/tools/test_wakeword_human_training_data.py -q

  javascript:
    runs-on: ubuntu-latest
    # Finite bound so a wedged step cannot burn the 6h default (WAVE-24).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.17"
      - name: Install exact JavaScript lock
        run: npm ci
      - name: Build frozen backend for packaged desktop test
        id: sidecar_build
        run: |
          node apps/desktop/packaging/backend-sidecar/build-sidecar.mjs
          echo "digest=$(cat apps/desktop/build/backend-sidecar/sidecar-root-digest.txt)" >> "$GITHUB_OUTPUT"
      - name: Type, lint and workspace tests
        env:
          # Test-only snapshot of THIS controlled CI build. PyInstaller onedir is
          # not bit-reproducible; the committed per-release Electron anchor stays
          # unchanged and release packaging still enforces it fail-closed.
          YOUTAB_AGENT_SIDECAR_CI_BUILD_DIGEST: ${{ steps.sidecar_build.outputs.digest }}
        run: npm run check

  # Windows portability gate (WAVE-23). The wake-word job already runs ON
  # windows-latest, but only the two backend artifacts — the broader runtime/CLI
  # portability surface (atomic writes, file locking, WAL, path/encoding,
  # subprocess construction, and the dashboard-auth lifecycle/serving invariants)
  # had no Windows coverage, so a Windows regression could land unseen. This job
  # runs the Windows-compatible runtime/CLI suite (tests/youtab_runtime +
  # tests/youtab_agent_cli) on every PR and on push to main. Genuinely
  # POSIX/Linux-only integration paths (systemd, s6, chown/uid, sudo, FHS
  # symlinks, /proc, curses, pty, POSIX permission bits, flock) skip via narrow
  # capability guards in tests/_wincompat.py — never a blanket platform skip, and
  # each is paired with a Windows fail-closed test. Not optional and not
  # continue-on-error: a red run blocks. (Making it a *required* status still
  # needs it added to the `main-required-gates` ruleset — an Owner change,
  # mirroring the note on the wake-word job above.)
  windows-runtime-cli:
    runs-on: windows-latest
    timeout-minutes: 60
    # Cancel a superseded run of THIS job on the same ref only — scoped so it
    # cannot affect the existing Linux/macOS/CodeQL/token-auth jobs.
    concurrency:
      group: windows-runtime-cli-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: "3.12"
      # Same locked install surface as python-security minus the POSIX-only
      # ingestion extra (wakeword-ingest/PyAV is for tests/tools, not run here).
      # `web` pins FastAPI to the deployed version; `slack` is present because
      # the platform-picker tests assert on plugins that only import with it.
      - name: Install locked development environment
        run: python -m pip install -e ".[dev,web,slack]"
      # scripts/run_tests.sh runs each test file in its own subprocess and
      # refuses to run without a venv carrying pytest, or YOUTAB_AGENT_PYTHON
      # pointing at one — point it at the setup-python interpreter, same as the
      # Linux gate. `-j 3` bounds parallelism on the 4-vCPU runner so the
      # subprocess-spawning meta-tests are not oversubscribed; `--file-retries 0`
      # forbids the retry-that-hides-a-flake (a file must pass on first run).
      # The suite output is tee'd to the job log (visible on failure in the run
      # output) rather than an artifact: this repo SHA-pins every third-party
      # action and introduces none it has not verified, so a new
      # upload-artifact action is deliberately not added here — the diagnostics
      # are already in the failed job's log.
      - name: Windows runtime/CLI suite (atomic-write, locking, WAL, paths, encoding, subprocess, lifecycle/auth)
        shell: bash
        env:
          YOUTAB_AGENT_PYTHON: ${{ steps.py.outputs.python-path }}
          TZ: UTC
          PYTHONUTF8: "1"
          # Per-file timeout, raised from the 300s default for THIS job only.
          # Cause is identified, not masked: the heaviest suites here spawn their
          # own child process (e.g. test_session_recovery runs `youtab_agent_cli
          # ... sessions recover`), and on the 4-vCPU windows-latest runner under
          # -j 3 that oversubscribes the CPU. Those files finish in ~8s on Linux
          # and ~19s alone on Windows, but scheduling variance can collide three
          # heavy files and starve one past 300s (observed 300.72s) — a
          # contention stall, NOT a hang. A generous ceiling absorbs the variance
          # while the 60-minute job timeout still bounds a genuine hang. `-j 3`
          # is unchanged (concurrency is not reduced to make tests pass).
          YOUTAB_AGENT_TEST_FILE_TIMEOUT: "900"
        run: |
          set -o pipefail
          bash scripts/run_tests.sh tests/youtab_runtime tests/youtab_agent_cli \
            -j 3 --file-retries 0 -q 2>&1 | tee windows-runtime-cli.log

  # Windows tools gate (WAVE-25). `tests/tools` runs in full on ubuntu (via
  # python-security's run_all_gates) and partially on the wake-word job, but its
  # broad surface — file-safety guards, device-path blocking, subprocess
  # construction, tirith, kanban attachments, ingestion — had no Windows
  # coverage, so a Windows-only regression in any of them could land unseen.
  # This job runs the Windows-compatible `tests/tools` suite on every PR and on
  # push to main. Genuinely POSIX-only paths (/dev, /proc, symlink, mode bits,
  # the tirith installer's platform key) skip via the same narrow capability
  # guards in tests/_wincompat.py used by the runtime/CLI gate — never a blanket
  # platform skip, and paired with Windows fail-closed tests
  # (tests/tools/test_windows_device_paths.py, test_windows_fallback_safety.py).
  # A separate job from windows-runtime-cli so this large suite has its own time
  # budget and cannot destabilise that gate. Making it a *required* status needs
  # it added to the `main-required-gates` ruleset once green (an Owner change,
  # mirroring the note on windows-runtime-cli above).
  windows-tools:
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: windows-tools-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: "3.12"
      # Same locked surface tests/tools needs on the ubuntu gate: `web` pins
      # FastAPI to the deployed version, `slack` for the platform-picker tests,
      # and `wakeword-ingest` brings numpy + PyAV for the ingestion suites
      # (module-top numpy imports — they fail rather than skip without it, by
      # design). PyAV and ai-edge-litert both ship Windows wheels at these pins.
      - name: Install locked development environment
        run: python -m pip install -e ".[dev,web,slack,wakeword-ingest]"
      # The branding gate's OCR tests need an engine; rapidocr is the accurate
      # one on this repo's assets (see python-security). onnxruntime arrives
      # transitively; ai-edge-litert supplies the tflite interpreter the
      # wake-word regression tests load.
      - name: Install the OCR engine and tflite runtime the tools suite needs
        run: python -m pip install 'rapidocr-onnxruntime==1.4.4' 'ai-edge-litert==2.1.6'
      # Each test file runs in its own subprocess (scripts/run_tests.sh), so a
      # single hung device/subprocess test hits the per-file timeout and is
      # reported without wedging the whole suite. `-j 3` bounds parallelism on
      # the 4-vCPU runner; `--file-retries 0` forbids the retry-that-hides-a-flake.
      - name: Windows tools suite (file-safety, device paths, subprocess, tirith, kanban, ingestion)
        shell: bash
        env:
          YOUTAB_AGENT_PYTHON: ${{ steps.py.outputs.python-path }}
          TZ: UTC
          PYTHONUTF8: "1"
          # Per-file ceiling raised from the 300s default for THIS job: the same
          # -j3 contention rationale as windows-runtime-cli, and tests/tools
          # carries heavier ingestion/subprocess files. The 90-minute job
          # timeout still bounds a genuine hang; -j3 is unchanged.
          YOUTAB_AGENT_TEST_FILE_TIMEOUT: "900"
        run: |
          set -o pipefail
          bash scripts/run_tests.sh tests/tools \
            -j 3 --file-retries 0 -q 2>&1 | tee windows-tools.log

  # WAVE-26 Agent Runtime capability benchmark (deterministic offline). Judges
  # runtime capability ONLY from observable, durable state — the run journal
  # (events by seq), the effect ledger, the egress audit trail, harness process
  # evidence, and files — never from the agent's self-report. No provider, no
  # network, no production home: the deterministic executors drive the REAL
  # WAVE-26 substrate at an isolated YOUTAB_AGENT_HOME + journal DB and controlled
  # fault injection, so a regression in any WAVE-26 module flips a verdict and
  # fails this gate. Model-quality dimensions (task quality, tool-selection/arg
  # accuracy, real token/cost, model-driven injection) are DEFINED with oracles
  # but marked real_provider and reported as unknown/OWNER_LIVE_PROVIDER_ACTION
  # _REQUIRED here — never coerced to pass or 0.
  #
  # NOT a required check yet: adding it to the `main-required-gates` ruleset is a
  # separate Owner step AFTER it is green once (mirroring the note on the
  # windows-runtime-cli / windows-tools jobs). Renaming this job renames the
  # check context, so a rename is a two-place change.
  benchmark-deterministic:
    runs-on: ubuntu-latest
    # Finite bound so a wedged step cannot burn the 6h default; well above the
    # normal ~1-2 min duration (one scenario spawns a real subprocess).
    timeout-minutes: 20
    # Cancel a superseded run of THIS job on the same ref only — scoped so it
    # cannot affect the other required jobs.
    concurrency:
      group: benchmark-deterministic-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: "3.12"
      # The benchmark imports youtab_runtime (journal/effect/egress/harness),
      # gateway.status, tools.url_safety and youtab_agent_cli.runtime_command_auth,
      # so it needs the same editable install as the runtime gates. `web` is
      # mandatory on every `pip install -e` here (governed by
      # tests/youtab_runtime/test_framework_version_matches_lock.py): without it
      # FastAPI resolves freely from the core range. stdlib + httpx only — no new
      # dependency and no uv.lock churn.
      - name: Install locked development environment
        run: python -m pip install -e ".[dev,web]"
      # Step 1 (authoritative): run the full deterministic bank through the CLI.
      # The CLI validates the task bank (>=40 scenarios, all 20 families),
      # asserts every observed verdict equals the verdict a correct runtime must
      # yield (--check-expected, default in deterministic mode), and exits
      # non-zero on ANY harness error or unexpected verdict. This is the backstop
      # against a silent no-collection: it fails loudly if the bank shrank or a
      # WAVE-26 module regressed.
      - name: Deterministic capability benchmark (authoritative)
        env:
          PYTHONUTF8: "1"
          TZ: UTC
        run: python -m tests.benchmark.harness.cli run --mode deterministic --out .bench
      # The measured record is the evidence, printed rather than uploaded (this
      # workflow SHA-pins every action and adds none it has not verified, so a new
      # upload-artifact action is deliberately not introduced). It contains only
      # verdicts + aggregate metrics over synthetic fixtures — no secrets, no
      # paths outside the checkout.
      - name: The measured record (summary.json)
        run: cat .bench/summary.json
      # Step 2 (runner-contract smoke): the same suite via the canonical runner,
      # per-file isolated, `--file-retries 0` (a file must pass first try). The
      # `benchmark` marker is excluded from default collection, so it is
      # re-selected with `-m benchmark`. Step 1 already guarantees the benchmark
      # actually ran, so this is defense-in-depth for the pytest path, not the
      # sole gate. No continue-on-error; a red run blocks.
      - name: Benchmark suite via canonical runner (synthetic-journey smoke)
        env:
          YOUTAB_AGENT_PYTHON: ${{ steps.py.outputs.python-path }}
          PYTHONUTF8: "1"
          TZ: UTC
        run: |
          set -o pipefail
          bash scripts/run_tests.sh tests/benchmark \
            -j 2 --file-retries 0 -m benchmark -q 2>&1 | tee benchmark.log
