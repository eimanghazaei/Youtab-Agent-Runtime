name: Youtab upstream mirror intake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: youtab-upstream-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch and prove every upstream branch and tag
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          scripts/youtab/sync_upstream_mirror.sh upstream
      - name: Push exact refs to quarantined origin namespaces
        run: |
          set -euo pipefail
          git push --prune origin \
            '+refs/youtab-upstream/heads/*:refs/heads/upstream-mirror/*'
          git push --prune origin \
            '+refs/youtab-upstream/tags/*:refs/tags/upstream-mirror/*'
      - name: Report update without merging product code
        run: |
          set -euo pipefail
          printf 'upstream_main=%s\n' "$(git rev-parse refs/youtab-upstream/heads/main)"
          printf 'product_head=%s\n' "$(git rev-parse HEAD)"
          echo 'Only upstream-mirror/* refs were changed.'
          echo 'No merge, rebase, product-branch, branding, or production mutation was performed.'
