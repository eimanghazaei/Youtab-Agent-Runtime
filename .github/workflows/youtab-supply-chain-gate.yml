name: Youtab supply-chain gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify lock integrity and generate evidence
        run: |
          set -euo pipefail
          scripts/youtab/create_evidence_pack.sh "$RUNNER_TEMP/youtab-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: youtab-source-supply-chain-evidence
          path: ${{ runner.temp }}/youtab-evidence
          if-no-files-found: error
